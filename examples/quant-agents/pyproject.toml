[project]
name = "quant-agents"
version = "0.1.0"
description = "Agent workflows for equity research: broker-call ingestion, consensus scoring, risk-limited sizing, backtesting, and human-approved order proposals."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
pdf = ["pypdf"]

[project.scripts]
quant-agents = "quant_agents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
